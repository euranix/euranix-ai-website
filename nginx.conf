server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # React hydration requires the CDN to preserve prerendered HTML verbatim.
    add_header Cache-Control "no-cache, no-transform" always;
    error_page 404 /404.html;
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /404.html { internal; }
    location = /404 { return 404; }
    location = /index { return 308 /$is_args$args; }
    location = /index.html { return 308 /$is_args$args; }
    rewrite ^(.+)/+$ $1 permanent;
    location ~ ^/(.+)\.html$ { return 308 /$1$is_args$args; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
